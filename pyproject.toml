[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pci-inference"
version = "0.1.0"
description = "Probabilistic compositional inference: distributed state and parameter estimation for systems of coupled subsystems"
readme = "README.md"
license = { text = "MIT" }
keywords = ["distributed estimation", "message passing", "Kalman filter", "system identification", "digital twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
authors = [{ name = "Esmaeil Ghorbani" }, { name = "Jürgen Hackl" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
config = ["pyyaml>=6.0"]
data = ["pandas>=2.0"]
symbolic = ["sympy>=1.12"]
all = ["matplotlib>=3.7", "pyyaml>=6.0", "pandas>=2.0", "sympy>=1.12"]
dev = ["pytest>=7", "matplotlib>=3.7", "pyyaml>=6.0", "pandas>=2.0", "sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/cisgroup/pci"
Repository = "https://github.com/cisgroup/pci"
Issues = "https://github.com/cisgroup/pci/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
