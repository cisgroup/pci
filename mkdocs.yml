site_name: pci
site_description: Probabilistic Compositional Inference, distributed state and parameter estimation for coupled engineered systems.
site_author: Esmaeil Ghorbani, Jürgen Hackl
site_url: https://cisgroup.github.io/pci/
repo_url: https://github.com/cisgroup/pci
repo_name: cisgroup/pci
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    # Follow the OS preference, with a manual toggle through light -> dark -> auto.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom # see docs/stylesheets/extra.css
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

# Injects the pci version into the footer (see scripts/mkdocs_hooks.py).
hooks:
  - scripts/mkdocs_hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cisgroup/pci
      name: pci on GitHub
    - icon: fontawesome/solid/file-lines
      link: https://arxiv.org/abs/2605.27544
      name: The paper on arXiv

# docs/tutorials and docs/case-studies are symlinks to examples/ and case_studies/.
# Keep the jupytext .py sources, helpers and data files out of the built site; the
# YAML twins stay in so the notebooks can link to them.
exclude_docs: |
  *.py
  data/
  __pycache__/
  .virtual_documents/
  .ipynb_checkpoints/

plugins:
  - search
  # Render the tutorial and case-study notebooks with their committed outputs.
  # execute:false keeps the docs build fast; only .ipynb become pages.
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include: ["*.ipynb"]
      theme: light
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            docstring_section_style: table
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 80
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            summary: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Tutorials:
      - tutorials/README.md
      - Quickstart, the 4-DOF testbed: tutorials/01_four_dof_jacobi_ukf.ipynb
      - Problems in YAML: tutorials/02_solve_from_yaml.ipynb
      - The forward problem: tutorials/03_forward_jacobi_vs_gauss_seidel.ipynb
      - Custom subsystems: tutorials/04_custom_subsystems.ipynb
      - Six DOF, three filters: tutorials/05_six_dof_three_subsystems.ipynb
      - The paper's 6-DOF system: tutorials/06_paper_six_dof_configurations.ipynb
      - Van der Pol meets Bouc-Wen: tutorials/07_vanderpol_boucwen.ipynb
  - Case studies:
      - case-studies/README.md
      - 9 DOF, 3 subsystems: case-studies/01_case_09dof.ipynb
      - 16 DOF, 4 subsystems: case-studies/02_case_16dof.ipynb
      - 20 DOF, 5 subsystems: case-studies/03_case_20dof.ipynb
      - 40 DOF, 10 subsystems: case-studies/04_case_40dof.ipynb
  - Concepts: concepts.md
  - Configuration (YAML): configuration.md
  - API reference:
      - reference/index.md
      - Top level, pci.solve: reference/api.md
      - System: reference/system.md
      - Subsystems: reference/subsystems.md
      - Interfaces: reference/interfaces.md
      - Schedules: reference/schedules.md
      - Filters: reference/filters.md
      - Integrators: reference/integrators.md
      - Loads: reference/loads.md
      - Models: reference/models.md
      - Results: reference/results.md
      - Internals: reference/internals.md
  - Changelog: changelog.md
  - Citing pci: citation.md
