# YAML twin of 05_six_dof_three_subsystems.py: the paper's 6-DOF system (script 02),
# explicit spring topology, seven unknowns, three different filters.
model: mass_spring_chain
masses: [500, 500, 600, 500, 500, 500]         # m3 = 500 + 100 (added mass)
springs:                                       # a: ground or DOF, b: DOF; name gives k<name>/c<name>
  - {a: ground, b: 1, k: 50000, c: 300}        # k1
  - {a: ground, b: 2, k: 40000, c: 350}        # k2
  - {a: 1, b: 2, k: 45000, c: 320}             # k3  unknown (S1)
  - {a: 2, b: 3, k: 30000, c: 400}             # k4  interface S1-S2
  - {a: 3, b: 4, k: 25000, c: 480}             # k5
  - {a: ground, b: 4, k: 55000, c: 700}        # k6  unknown (S2)
  - {a: 4, b: 5, k: 30000, c: 350}             # k7  interface S2-S3
  - {a: ground, b: 5, k: 45000, c: 460}        # k8
  - {a: 5, b: 6, k: 40000, c: 480}             # k9  unknown (S3)
  - {a: 3, b: 4, k: 40000, c: 0, name: "34"}   # k34 parallel spring, unknown (S2)
subsystems: [[1, 2], [3, 4], [5, 6]]
filters: {S1: ukf, S2: ckf, S3: ekf}
integrator: heun
schedule: jacobi
unknowns:                                      # 0.7 x true initial guesses
  k3:  {initial: 31500, std: 1.0e4}
  c3:  {initial: 224,   std: 3.0e2}
  k6:  {initial: 38500, std: 1.0e4}
  c6:  {initial: 490,   std: 3.0e1}
  k34: {initial: 28000, std: 1.0e4}
  k9:  {initial: 28000, std: 1.0e4}
  c9:  {initial: 336,   std: 3.0e2}
sensors: [a2, a3, a4, a5]
noise_std: {a2: 3.0e-2, a3: 1.0e-1, a4: 1.0e-1, a5: 3.0e-2}   # already the inflated values of the script
loads:
  4: {type: random, std: 1500, seed: 123}
time: {dt: 2.0e-3, T: 20.0}
truth: {seed: 1, noise_std: 1.0e-3}            # data noise 1e-3; noise_std above is the inflated R of the script
prior: {state_var: 1.0e-4, process_var: 1.0e-11, r_inflation: 1}
