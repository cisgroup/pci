name: docs

# Builds the MkDocs site and deploys it to the gh-pages branch on every push to main.
# GitHub Pages must be enabled once in the repository settings (source: gh-pages
# branch). On a private repository Pages needs a plan that supports it; until then
# `mkdocs serve` shows the same site locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'cisgroup/pci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[docs]"

      - name: Deploy docs to GitHub Pages
        run: mkdocs gh-deploy --force
