name: Release

# Publish to PyPI when a version tag is pushed (`git tag v0.2.0 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored. One-time setup: add a
# trusted publisher on PyPI for project `pci-inference`, repository cisgroup/pci,
# workflow `release.yml`, environment `pypi`; create the `pypi` environment on GitHub.
# See RELEASING.md.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify tag matches package version
        run: |
          pkg=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version v$pkg"
            exit 1
          fi

      - name: Gate (lint, tests, docs)
        run: |
          ruff check .
          pytest -q
          mkdocs build --strict

      - name: Build sdist + wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.repository == 'cisgroup/pci'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC, required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
