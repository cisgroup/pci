name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  notebooks:
    name: notebooks + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Paired notebooks are in sync
        # Every committed .ipynb must match its jupytext .py source (fails on a stale pair).
        run: python scripts/check_notebook_sync.py

      - name: Execute tutorials
        # The paired notebooks are executed from scratch with nbmake. PCI_T shortens
        # the long horizons (tutorial 06 and the case studies) for the smoke run; the
        # weekly examples.yml executes them at full length.
        env:
          PCI_T: "5"
          MPLBACKEND: Agg
        run: pytest --nbmake --nbmake-timeout=900 examples/*.ipynb

      - name: Execute case studies
        env:
          PCI_T: "5"
          MPLBACKEND: Agg
        run: pytest --nbmake --nbmake-timeout=900 case_studies/*.ipynb

      - name: Docs build (strict)
        run: mkdocs build --strict
